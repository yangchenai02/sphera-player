<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sphera Player — HLS + hotspots example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #app { width: 100%; height: 100vh; }
      .toast {
        position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%);
        z-index: 10; background: rgba(0, 0, 0, 0.8); color: #fff;
        font: 14px system-ui, sans-serif; padding: 10px 16px; border-radius: 8px;
        opacity: 0; transition: opacity 0.25s;
      }
      .toast.show { opacity: 1; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/",
          "hls.js": "https://cdn.jsdelivr.net/npm/hls.js@1.6.15/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>
    <script type="module">
      import { SpheraPlayer } from '../dist/sphera-player.es.js';

      const params = new URLSearchParams(location.search);
      // Replace with your own HLS 360 stream (must be served with CORS headers).
      const src = params.get('src') ?? 'https://cdn.example.com/your-360-stream.m3u8';

      const toast = document.getElementById('toast');
      let toastTimer;
      const showToast = (text) => {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
      };

      const player = new SpheraPlayer('#app', {
        src,
        sourceType: 'hls',
        projection: 'equirect360',
        hotspots: [
          { id: 'entrance', yaw: 0, pitch: 0, label: 'Entrance' },
          { id: 'stage', yaw: 70, pitch: 8, label: 'Stage', data: { zone: 'stage' } },
          { id: 'balcony', yaw: -110, pitch: 18, label: 'Balcony' },
        ],
      });
      player.on('hotspotactivate', ({ id }) => showToast(`Hotspot: ${id}`));
      player.on('qualitychange', ({ label }) => showToast(`Quality: ${label}`));
      player.on('error', (err) => console.error('[sphera]', err.code, err.message));
    </script>
  </body>
</html>
