<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sphera Player — stereo 360 / VR180 example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      #app { width: 100%; height: 100vh; }
      .note {
        position: fixed; top: 10px; left: 12px; z-index: 10;
        color: #ddd; font: 14px/1.5 system-ui, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); margin: 0;
      }
      .note button { margin-right: 6px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/",
          "hls.js": "https://cdn.jsdelivr.net/npm/hls.js@1.6.15/+esm"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <p class="note">
      <button data-projection="equirect360-tb">360 TB</button>
      <button data-projection="equirect360-sbs">360 SBS</button>
      <button data-projection="vr180">VR180</button>
      Flat preview shows the left eye; use a WebXR headset for stereo.
      Append <code>?src=YOUR_VIDEO_URL</code> to play your own clip.
    </p>
    <script type="module">
      import { SpheraPlayer } from '../dist/sphera-player.es.js';

      const params = new URLSearchParams(location.search);
      const src = params.get('src') ?? 'https://cdn.example.com/your-stereo-video.mp4';

      const player = new SpheraPlayer('#app', {
        src,
        projection: params.get('projection') ?? 'equirect360-tb',
        autoplay: 'muted',
      });
      player.on('error', (err) => console.error('[sphera]', err.code, err.message));
      player.on('projectionchange', ({ projection }) =>
        console.log('[sphera] projection:', projection),
      );
      document.querySelectorAll('[data-projection]').forEach((btn) => {
        btn.addEventListener('click', () =>
          player.setProjection(btn.getAttribute('data-projection')),
        );
      });
    </script>
  </body>
</html>
